name: Sync manifest version

# git-flow: when you create/push a release branch (release/X.Y.Z), set the
# integration's manifest version to match, so the eventual tag already carries
# the correct version and HACS installs it verbatim. Runs only on release
# branches; the bot's push does not re-trigger workflows, and the guard makes
# it a no-op once versions match.
on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set manifest version from the release branch name
        run: |
          version="${GITHUB_REF_NAME#release/}"
          version="${version#v}"
          file="custom_components/mempool/manifest.json"
          current="$(jq -r .version "$file")"
          if [ "$current" = "$version" ]; then
            echo "manifest already at $version — nothing to do"
            exit 0
          fi
          jq --arg v "$version" '.version = $v' "$file" > "$file.tmp"
          mv "$file.tmp" "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: set manifest version to $version"
          git push
