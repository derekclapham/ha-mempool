# Strict typing settings for the integration, matching what Home Assistant core
# applies to integrations listed in its .strict-typing file. `strict = true`
# covers most of it; warn_unreachable is the one core adds on top and is worth
# having — it is what caught a defensive isinstance() check that had become
# dead code once the API client started validating response shapes itself.
#
# Only custom_components/mempool is checked. The tests are not: Home Assistant
# does not type-check its own integration tests either, and the fixtures make
# heavy use of untyped test helpers.
[mypy]
# Deliberately no python_version: it must track whatever interpreter the
# installed Home Assistant needs, and pinning it here made mypy fail to parse
# core's own 3.14-only syntax.
strict = true
warn_unreachable = true
files = custom_components/mempool

# Home Assistant ships type hints but many of its internals are not strictly
# typed; without this, errors from inside `homeassistant.*` drown out ours.
follow_imports = silent

[mypy-custom_components.mempool.*]
disallow_any_generics = true
